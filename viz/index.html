<!doctype html>
<html lang="pl">
<head>

<title>Blinding Lights — wizualizacja</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: system-ui, "Segoe UI", sans-serif; color: #cfe; }
  canvas { display: block; position: fixed; inset: 0; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    background: rgba(0,0,0,.55); transition: opacity .6s; z-index: 2; }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay small { opacity: .6; letter-spacing: .05em; }
  button { font: inherit; font-size: 18px; letter-spacing: .25em; padding: 14px 40px;
    border-radius: 999px; border: 1px solid #7ef; background: transparent; color: #7ef;
    cursor: pointer; text-transform: uppercase; box-shadow: 0 0 24px rgba(120,255,255,.25); }
  button:hover { background: rgba(120,255,255,.12); }
  #hud { position: fixed; left: 12px; bottom: 10px; z-index: 1; white-space: pre;
    font: 12px/1.45 ui-monospace, Consolas, monospace; opacity: .55; }
  #hud.off { display: none; }
  #err { color: #f88; max-width: 80vw; text-align: center; }
</style>

<div id="overlay">
  <button id="start">Start</button>
  <small>Spacja: pauza · H: ukryj panel</small>
